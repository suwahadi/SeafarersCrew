name: seafarers-crew

x-restart: &restart
  restart: unless-stopped

services:
  proxy:
    <<: *restart
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "/app/seafarers migrate up && /app/seafarers db:seed && exec /app/seafarers serve"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      s3:
        condition: service_healthy
        required: false
    networks: [internal]

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seafarers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-seafarers}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gotenberg:
    <<: *restart
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=60s", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  s3:
    <<: *restart
    image: chrislusf/seaweedfs:3.97
    profiles: [s3]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-}
    volumes:
      - s3data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  s3data:
