name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips and Ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev ghostscript

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Service coverage
        run: go tool cover -func=coverage.out | grep -E "internal/service/|total"

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:8080
          PUBLIC_API_URL: http://localhost:8080
          APP_URL: http://localhost:3000
          REVALIDATE_SECRET: ci-only-revalidate-secret-0123456789

  docker:
    runs-on: ubuntu-latest
    needs: [backend, admin, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/api.Dockerfile -t seafarers-api:ci .
      - name: Build proxy image with the admin SPA
        run: docker build -f deploy/proxy.Dockerfile -t seafarers-proxy:ci .
      - name: Build website image
        run: docker build -f deploy/web.Dockerfile -t seafarers-web:ci .

  lighthouse:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare environment
        run: sh deploy/ci/env.sh
      - name: Start the stack
        run: docker compose -f docker-compose.yml -f deploy/ci/compose.ci.yml --profile s3 up -d --build --wait api web postgres redis gotenberg s3
      - name: Load the demo data
        run: docker compose exec -T api /app/seafarers db:seed --demo
      - name: Lighthouse on Home, a CMS page, News detail, Career and Contact
        run: node deploy/ci/lighthouse.mjs
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
