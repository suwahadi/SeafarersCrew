Redoc.init({"openapi": "3.1.0", "info": {"title": "Crew Management Platform API", "version": "1.0.0", "summary": "HTTP API of the crew management platform (admin and public).", "description": "This document describes the complete HTTP API of the platform: the **admin API**\nused by the back-office single-page application, and the **public API** used by\nthe public website.\n\n## Base paths\n\n| API | Base path | Authentication |\n| --- | --- | --- |\n| Admin | `/api/admin/v1` | Session cookie + CSRF header |\n| Public | `/api/public/v1` | None |\n| Health | `/healthz`, `/readyz` | None |\n\n## Authentication (admin API)\n\n1. `POST /api/admin/v1/auth/login` with email and password. On success the server sets two cookies:\n   `sc_session` (HttpOnly, session identifier) and `sc_csrf` (CSRF token). Both are `SameSite=Strict`,\n   and `Secure` when the deployment runs over HTTPS.\n2. Send the cookies with every request. For every state-changing request (`POST`, `PUT`, `PATCH`, `DELETE`)\n   also send the header `X-CSRF-Token` with exactly the value of the `sc_csrf` cookie (double-submit check).\n3. When an account is flagged to change its password, every endpoint except `GET /me`,\n   `PUT /me/password` and `POST /auth/logout` answers `403 password_change_required`.\n4. `POST /auth/logout` ends the session and clears both cookies.\n\nThere are no API keys or bearer tokens. The API is intended to be called from the admin application\n(same site) and not from third-party servers.\n\n## Response format\n\n| Case | Shape |\n| --- | --- |\n| Single resource or action | `{\"data\": {...}}` |\n| List | `{\"data\": [...], \"meta\": {\"page\": 1, \"per_page\": 20, \"total\": 134}}` |\n| Empty success | `204 No Content` |\n| Error | `{\"error\": {\"code\": \"validation_failed\", \"message\": \"...\", \"fields\": {\"email\": \"...\"}}}` |\n\n`error.code` is stable and meant for programmatic handling; `error.message` is human readable;\n`error.fields` is present for validation errors (field name to message).\nEvery response carries `Cache-Control: no-store` except the cached public endpoints.\n\n## Conventions\n\n- **Lists** accept `page` (default 1), `per_page` (10, 20, 30, 50 or 100; default 20), `sort`, `order` (`asc` or `desc`) and `q` (search text, up to 100 characters).\n- **Dates** are `YYYY-MM-DD`. **Timestamps** are UTC, RFC 3339.\n- **Money** is a decimal string with two fraction digits (never a floating-point number). Amounts are stored and shown in the currency of the record; there is no currency conversion.\n- **JSON bodies** must be sent with `Content-Type: application/json` on endpoints that require it; uploads use `multipart/form-data`.\n- **Files** are never served directly: the API returns short-lived presigned URLs.\n- **Request tracing:** every response includes `X-Request-ID`; quote it when reporting a problem.\n\n## Rate limits\n\n| Area | Limit |\n| --- | --- |\n| Admin API | 1200 requests per minute per client IP |\n| Public API | 600 requests per minute per client IP |\n\nExceeding a limit returns `429 too_many_attempts` with a `Retry-After` header (seconds).\nLogin, recovery and the public forms have stricter limits, described on each operation.\n\n## Security notes for integrators\n\n- This document contains no credentials. Obtain secrets through the secure hand-over channel agreed with the operator and rotate them after hand-over.\n- Personal data (passport, bank details, full addresses) is never written to logs. Do the same in your own integrations.\n- Admin endpoints must not be exposed to the public internet without the platform's reverse proxy, TLS and CORS configuration.\n", "contact": {"name": "Platform operator"}}, "servers": [{"url": "https://{host}", "description": "Production or staging deployment", "variables": {"host": {"default": "example.com", "description": "Public host name of the deployment."}}}, {"url": "http://localhost:8080", "description": "Local development"}], "security": [{"sessionCookie": []}], "tags": [{"name": "Health"}, {"name": "Auth"}, {"name": "Branding"}, {"name": "Settings"}, {"name": "Master data"}, {"name": "Jobs"}, {"name": "Files"}, {"name": "Dashboard"}, {"name": "Backups"}, {"name": "Crew"}, {"name": "Crew import/export"}, {"name": "Contracts"}, {"name": "Rotation"}, {"name": "Document templates"}, {"name": "Generated documents"}, {"name": "Quotations"}, {"name": "Email"}, {"name": "CMS"}, {"name": "Vacancies"}, {"name": "Applicants"}, {"name": "Contact inbox"}, {"name": "Public site"}, {"name": "Public career"}], "components": {"securitySchemes": {"sessionCookie": {"type": "apiKey", "in": "cookie", "name": "sc_session", "description": "Session cookie set by `POST /api/admin/v1/auth/login`."}, "csrfHeader": {"type": "apiKey", "in": "header", "name": "X-CSRF-Token", "description": "Must equal the value of the `sc_csrf` cookie. Required on every state-changing admin request, in addition to the session cookie."}}, "parameters": {"Page": {"name": "page", "in": "query", "description": "Page number, starting at 1.", "schema": {"type": "integer", "minimum": 1, "default": 1}}, "PerPage": {"name": "per_page", "in": "query", "description": "Page size. Other values fall back to the default.", "schema": {"type": "integer", "enum": [10, 20, 30, 50, 100], "default": 20}}, "Sort": {"name": "sort", "in": "query", "description": "Column to sort by. The allowed values depend on the resource.", "schema": {"type": "string"}}, "Order": {"name": "order", "in": "query", "description": "Sort direction.", "schema": {"type": "string", "enum": ["asc", "desc"], "default": "asc"}}, "Q": {"name": "q", "in": "query", "description": "Free-text search, truncated to 100 characters.", "schema": {"type": "string", "maxLength": 100}}}, "schemas": {"FieldErrors": {"type": "object", "description": "Map of field name to validation message.", "additionalProperties": {"type": "string"}, "example": {"email": "The email field must be a valid email address."}}, "Error": {"type": "o ssword", "description": "Verifies the credentials, deletes the session sent in the `sc_session` cookie (if any) and opens a new one (session rotation). The response does not block a flagged account: when `admin.must_change_password` is true the client must call `PUT /me/password` before anything else. Idle sessions expire after 8 hours of inactivity and every session after 7 days.\n\nLockout rules: failed attempts are counted per client IP in a 15 minute window. Five failures lock that IP for 15 minutes (counted from the fifth failure); during the lockout every attempt, even with correct credentials, returns 429 `too_many_attempts` with the message `Too many failed attempts. Try again in N minute(s).` A successful attempt resets the counter. The login and recovery endpoints keep separate counters. Requests also count against the admin API rate limit (1200 per minute per IP, 429 with a `Retry-After` header).", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthLoginRequest"}, "example": {"email": "user@example.com", "password": "correct-horse-battery-staple"}}}, "description": "Must be sent as `application/json`."}, "security": [], "responses": {"200": {"description": "Signed in. Session and CSRF cookies are set; the body repeats the CSRF token.", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/AuthSession"}}}, "example": {"data": {"admin": {"id": "0b6f2a54-3f0e-4a54-9d1a-7a1e2c9a1f10", "name": "Rina Wulandari", "email": "user@example.com", "must_change_password": false, "password_changed_at": "2026-09-01T03:15:00Z"}, "csrf_token": "example-csrf-token-0000"}}}}, "headers": {"Set-Cookie": {"description": "Sets `sc_session` (session ID) and `sc_csrf` (CSRF token), sent as two Set-Cookie headers. Both: `Path=/`, `HttpOnly`, `SameSite=Strict`, `Max-Age=604800` (7 days), `Secure` when the deployment runs over HTTPS.", "sche  "rank_applied_id": "0198a7c2-5b1e-7c3a-9d41-2f6e8b0c1a77", "years_experience": 8, "message": "Available from December.", "consent": "true", "cf-turnstile-response": "<turnstile-token>"}, "encoding": {"cv": {"contentType": "application/octet-stream"}, "documents": {"contentType": "application/octet-stream"}}}}}, "responses": {"201": {"description": "Application accepted (or silently discarded when the honeypot field `website` is filled; a plausible id is returned in that case).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublicApplicationCreatedResponse"}, "example": {"data": {"application_id": "K7M3PQ9XA"}}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "404": {"description": "Vacancy not found (unknown reference or draft). Code `not_found`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Conflict. Codes: `vacancy_closed` (vacancy is closed or past its closing date), `duplicate_application` (same applicant already applied to this vacancy within the last 30 days).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "413": {"description": "Payload too large. Codes: `payload_too_large` (whole request exceeds (max documents + 1) x max file size + 1 MiB) or `file_too_large` (a single file exceeds the configured upload limit).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "415": {"description": "Content-Type is not multipart/form-data. Code `unsupported_media_type`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"description": "Validation failed (`validation_failed` with per-field `fields`), Turnstile check failed (`turnstile_failed`), or an uploaded file was rejected (`invalid_file_name`, `invalid_file_type`, `file_rejected`; `fields` names `cv` or `documents`).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Err
