version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: receiver-naming
    gosec:
      excludes:
        - G104
  exclusions:
    rules:
      - path: internal/handler/public/media_handler.go
        text: G705
        linters:
          - gosec
      - path: internal/middleware/public_cache.go
        text: G705
        linters:
          - gosec
      - path: internal/handler/public/application_handler.go
        text: G120
        linters:
          - gosec
      - path: internal/platform/nextjs/nextjs.go
        text: G101
        linters:
          - gosec
      - path: internal/service/crew_import_service.go
        text: G101
        linters:
          - gosec
      - path: internal/middleware/auth.go
        text: G124
        linters:
          - gosec
      - path: internal/platform/pgdump/pgdump.go
        text: G204
        linters:
          - gosec
      - path: internal/platform/pdf/pdf.go
        text: "G204|G304"
        linters:
          - gosec
      - path: database/seeders/
        text: G404
        linters:
          - gosec
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/suwahadi/seafarerscrew
